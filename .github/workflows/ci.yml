name: MedLens CI Pipeline & Clinical Evaluation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Build, Typecheck, Test & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Test Suite (Unit, Integration, AI Regression, Performance)
        run: npx vitest run

      - name: Verify Evaluation Suite
        run: npx vitest run tests/ai/

      - name: Check Latency SLA
        run: npx vitest run tests/performance/
